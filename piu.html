<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIU - Panel de Información al Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            user-select: none;
        }

        .piu-header-badge {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ff9900;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 153, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .dot-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
        }

        .dot-status.online {
            background: #00e676;
            box-shadow: 0 0 8px #00e676;
        }

        /* Contenedor principal que usa la imagen proporcionada como fondo */
        .piu-canvas {
            width: 960px;
            height: 540px;
            background-image: url('assets/backgrounds/piu_bg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Capa de datos superpuesta */
        .data-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Estilo común para los campos de valor */
        .value-field {
            position: absolute;
            right: 13.5%;
            width: 38%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #ff0000;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        #display-initial {
            top: 138px;
        }

        #display-recharge {
            top: 238px;
        }

        #display-final {
            top: 335px;
        }

        .empty {
            opacity: 0;
        }

        #status-msg {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>

<body>
    <div class="piu-header-badge">
        <span id="piu-dot" class="dot-status"></span>
        <span id="piu-title-text">PIU - DISPOSITIVO 0068</span>
    </div>

    <div class="piu-canvas">
        <div class="data-overlay">
            <div id="display-initial" class="value-field empty"></div>
            <div id="display-recharge" class="value-field empty"></div>
            <div id="display-final" class="value-field empty"></div>
        </div>
        <div id="status-msg">ESPERANDO TARJETA...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentDeviceId = urlParams.get('device') || '0068';

        document.getElementById('piu-title-text').innerText = `PIU - DISPOSITIVO ${currentDeviceId}`;
        document.title = `PIU [${currentDeviceId}] - TransMilenio`;

        const localChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('tca_simulator_channel') : null;

        function getWsUrl() {
            const params = new URLSearchParams(window.location.search);
            const customHost = params.get('ws') || params.get('ip');
            if (customHost && window.location.protocol !== 'https:') {
                return `ws://${customHost}:8080`;
            }
            let host = window.location.hostname || 'localhost';
            if (host.includes('vercel.app') || (window.location.protocol === 'https:' && host !== 'localhost')) {
                return 'ws://localhost:8080';
            }
            return `ws://${host}:8080`;
        }

        let socket = null;
        const piuDot = document.getElementById('piu-dot');
        const initialEl = document.getElementById('display-initial');
        const rechargeEl = document.getElementById('display-recharge');
        const finalEl = document.getElementById('display-final');
        const statusMsg = document.getElementById('status-msg');

        function formatMoney(amount) {
            if (amount === null || amount === undefined || amount === "") return "";
            return "$ " + parseInt(amount).toLocaleString('es-CO');
        }

        function clearDisplay() {
            initialEl.innerText = "";
            rechargeEl.innerText = "";
            finalEl.innerText = "";
            initialEl.classList.add('empty');
            rechargeEl.classList.add('empty');
            finalEl.classList.add('empty');
            statusMsg.innerText = "ESPERANDO TARJETA...";
            statusMsg.style.display = "block";
        }

        function handlePiuData(data) {
            if (!data) return;
            if (data.deviceId && data.deviceId !== currentDeviceId) {
                return;
            }
            if (data.type === 'PIU_UPDATE') {
                if (data.state === 'IDLE') {
                    clearDisplay();
                } else if (data.state === 'CARD_DETECTED') {
                    clearDisplay();
                    initialEl.innerText = formatMoney(data.balance);
                    initialEl.classList.remove('empty');
                    statusMsg.innerText = "TARJETA DETECTADA";
                } else if (data.state === 'SUCCESS') {
                    statusMsg.innerText = "RECARGA EXITOSA";
                    initialEl.innerText = formatMoney(data.previousBalance);
                    rechargeEl.innerText = formatMoney(data.amount);
                    finalEl.innerText = formatMoney(data.total);

                    initialEl.classList.remove('empty');
                    rechargeEl.classList.remove('empty');
                    finalEl.classList.remove('empty');
                }
            }
            if (data.type === 'CARD_REMOVED') {
                clearDisplay();
            }
        }

        if (localChannel) {
            piuDot.classList.add('online');
            localChannel.onmessage = (event) => handlePiuData(event.data);
        }

        function connectWs() {
            try {
                const wsUrl = getWsUrl();
                socket = new WebSocket(wsUrl);

                socket.onopen = () => {
                    console.log(`PIU [${currentDeviceId}] conectado al bridge en ${socket.url}`);
                    piuDot.classList.add('online');
                };

                socket.onclose = () => {
                    if (!localChannel) piuDot.classList.remove('online');
                    setTimeout(connectWs, 3000);
                };

                socket.onerror = () => { };

                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handlePiuData(data);
                    } catch (e) {
                        console.error("Error procesando mensaje en PIU:", e);
                    }
                };
            } catch (err) {
                console.error(err);
                setTimeout(connectWs, 3000);
            }
        }

        connectWs();
    </script>
</body>

</html>
